# Render Blueprint — defines all services for deployment
# Docs: https://docs.render.com/blueprint-spec

services:
  # Main web service (FastAPI backend + frontend)
  - type: web
    name: ai-newsletter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false

  # Cron job — generates newsletter twice a week (Mon & Thu at 8 AM UTC)
  - type: cron
    name: ai-newsletter-cron
    runtime: python
    plan: free
    schedule: "0 8 * * 1,4"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m cron_worker
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
